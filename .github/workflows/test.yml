name: Tests

on:
  push:
    branches: ["main", "ui/general-ui"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest numpy scipy mediapipe opencv-python-headless \
            flask flask-cors supabase python-dotenv werkzeug

      - name: Run tests
        run: pytest test_app.py -v
